# Trilhas ("Detonados"): sequências de desafios, na ordem em que aparecem em /trilhas.
# steps: slugs dos desafios (nome da pasta em challenges/<categoria>/<slug>).
# `npm run seed` importa; trilha removida daqui some do site.
# Só desafios com testes (stdio) contam para zerar a trilha; shader e canvas entram como passo livre.
# Toda trilha precisa de pelo menos um desafio stdio.
- id: primeiros-passos-em-c
  title: Primeiros passos em C
  description: Do FizzBuzz a uma tabela hash feita na mão. Loops, strings, bits e ponteiros, um andar por vez.
  steps:
    - fizzbuzz
    - wc
    - truques-com-bits
    - numeros-gigantes
    - tabela-hash

- id: estruturas-na-unha
  title: Estruturas de dados na unha
  description: Escreva as estruturas que você sempre pegou prontas, em C, C++ e Rust, e feche com Dijkstra.
  steps:
    - linked-list-generica
    - vec-simplificado
    - tabela-hash
    - lru-cache
    - dijkstra

- id: escreva-seu-malloc
  title: Escreva seu próprio malloc
  description: Aqueça com bits e uma calculadora de pilha, depois gerencie um heap de verdade com first-fit.
  steps:
    - truques-com-bits
    - calculadora-rpn
    - alocador-first-fit

- id: do-pixel-ao-ray-marching
  title: Do pixel ao ray marching
  description: Aqueça com shaders no navegador, trace uma esfera pixel a pixel num PPM e termine marchando raios em GLSL.
  steps:
    - xadrez-giratorio
    - plasma-glsl
    - mandelbrot
    - ray-tracer-esfera
    - raymarching-sdf

- id: maratona-de-entrevista
  title: Maratona de entrevista
  description: Os clássicos do LeetCode em stdin/stdout, do Two Sum à mediana em O(log). Feita para a CLI (korin pick).
  steps:
    - dois-numeros
    - parenteses-validos
    - substring-sem-repeticao
    - intervalos-fundidos
    - k-mais-frequentes
    - agua-da-chuva
    - mediana-de-dois-vetores
