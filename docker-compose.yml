# docker compose up -d --build                       app + PostgreSQL
# docker compose exec app npx tsx scripts/invite.ts --admin   primeiro convite de admin
# docker compose --profile test run --rm test         typecheck + testes unitários
# App em http://localhost:3000. O código dos jogadores não roda aqui: roda no navegador
# (Python/Pyodide) ou no Compiler Explorer (C, C++, Rust). Veja src/lib/runner/README.md.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000" # porta ocupada? APP_PORT=3001 docker compose up -d
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://korin:${POSTGRES_PASSWORD:-korin}@db:5432/korin
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-3000}}
      ADMIN_BOOTSTRAP_CODE: ${ADMIN_BOOTSTRAP_CODE:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      RUN_RATE_PER_MINUTE: "20"
    volumes:
      - ./challenges:/app/challenges:ro
    depends_on:
      db:
        condition: service_healthy

  # Mesmo motor do Supabase. Dev local com o app fora do container:
  #   docker compose up -d db   e no .env: DATABASE_URL="postgresql://korin:korin@localhost:5432/korin"
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432" # só na máquina local
    environment:
      POSTGRES_USER: korin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-korin}
      POSTGRES_DB: korin
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korin -d korin"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Testes num container: typecheck e unitários. As soluções de referência (npm run verify)
  # precisam de gcc, g++, rustc e python3 e rodam no CI (.github/workflows/ci.yml).
  #   docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: build # estágio com devDependencies e código-fonte
    command: sh -c "npm run typecheck && npm test"
    environment:
      DATABASE_URL: postgresql://korin:${POSTGRES_PASSWORD:-korin}@db:5432/korin
    volumes:
      - ./challenges:/app/challenges:ro

volumes:
  pg-data:
